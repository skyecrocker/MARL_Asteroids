[project]
name = "marl-asteroids"
version = "0.1.0"
description = "Team-based multi-agent Asteroids environment and PPO training (ASEN 5264 project)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "gymnasium==1.3.0",
    "numpy==2.4.6",
    "pettingzoo==1.27.0",
    # pygame-ce: maintained drop-in fork of pygame, required by pygame_gui. Never install plain
    # "pygame" alongside it: both provide the same `pygame` module and clobber each other.
    "pygame-ce",
    "pygame-gui",
    # No SB3 [extra]: it pulls unused Atari deps
    "stable-baselines3==2.9.0",
    "tensorboard==2.21.0",
    "tqdm==4.70.1",
    "rich==15.0.0",
    "supersuit==3.11.0",
    "torch==2.14.1",
]

[project.scripts]
marl-asteroids = "marl_asteroids.app.main:main"

[dependency-groups]
dev = [
    "pytest",
    "ipykernel",
    "matplotlib",
    "pandas",
    "imageio[ffmpeg]==2.37.0",
    "hypothesis>=6.170.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:pettingzoo.*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["marl_asteroids"]
